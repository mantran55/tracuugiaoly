<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tra Cứu Điểm Danh - Giáo Xứ Biên Hòa</title>

    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <link rel="icon" type="image/png" href="favico.png">
    <link rel="stylesheet" href="styles.css?v=20260911-mobile">
</head>

<body class="index-page">

    <div class="bg-decor"></div>
    <div class="bg-grid"></div>

    <div class="toast" id="toast">
        <span class="material-icons-round" style="font-size:18px;">warning</span>
        <span id="toastMsg"></span>
    </div>

    <!-- HEADER -->
    <header class="header">
        <div class="header-orb"></div>
        <div class="header-orb"></div>
        <div class="header-orb"></div>

        <div class="header-content">
            <div class="header-badge">TRA CỨU ĐIỂM DANH</div>

            <div class="logo-wrap">
                <div class="logo-glow"></div>
                <div class="logo-ring ring-inner"></div>
                <div class="logo-ring ring-outer"></div>
                <div class="ring-dot"></div>
                <div class="ring-dot-outer"></div>
                <img src="giaoxu.png" class="logo" alt="Logo Giáo Xứ">
            </div>

            <h1>GIÁO XỨ BIÊN HÒA</h1>

            <div class="header-sub">
                <span>THIẾU NHI THÁNH THỂ VIỆT NAM</span><br>
                <span>Theo dõi kết quả điểm lễ và giáo lý các em</span>
            </div>
        </div>
    </header>

    <!-- NỘI DUNG -->
    <div class="container">

        <div class="search-card">
            <form class="search-form" id="searchForm">
                <div class="search-input-wrap">
                    <span class="material-icons-round search-icon">search</span>
                    <input type="text" id="studentId" placeholder="Nhập mã học viên trên thẻ..." required autocomplete="on" autocapitalize="characters" spellcheck="false">
                </div>
                <button type="submit">
                    <span class="material-icons-round">manage_search</span>
                    TRA CỨU
                </button>
            </form>
        </div>

        <div id="result">
            <div class="state-box">
                <div class="state-image">
                    <img src="hd.jpg" alt="Hướng dẫn tra cứu">
                </div>

                <div class="state-text">
                    Nhập mã học viên trên thẻ để tra cứu
                </div>
        </div>
        </div>

        <footer class="footer">
            <div class="footer-text">GIÁO XỨ BIÊN HÒA</div>
            
        </footer>

    </div>

    <script>

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        function animateNumber(el, target) {
            const dur = 700;
            const start = performance.now();
            function tick(now) {
                const p = Math.min((now - start) / dur, 1);
                const ease = 1 - Math.pow(1 - p, 3);
                el.textContent = Math.round(target * ease);
                if (p < 1) requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
        }

        /* Xác định kết quả pass/fail cho badge */
        function getResultBadge(result) {
            if (!result) return '<span class="result-badge none">&mdash;</span>';
            const lower = result.toLowerCase().trim();
            const isPass = lower.includes('đạt') || lower.includes('pass') || lower === 'đ';
            const isFail = lower.includes('không') || lower.includes('fail') || lower === 'kđ';
            if (isPass) return '<span class="result-badge pass"><span class="material-icons-round">check_circle</span>' + result + '</span>';
            if (isFail) return '<span class="result-badge fail"><span class="material-icons-round">cancel</span>' + result + '</span>';
            return '<span class="result-badge none">' + result + '</span>';
        }

        function getStatusKey(status) {
            return String(status || '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/đ/g, 'd')
                .replace(/Đ/g, 'D')
                .toLowerCase()
                .trim()
                .replace(/\s+/g, '-');
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>'"]/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            })[char]);
        }

        async function copyPhone(phone) {
            try {
                await navigator.clipboard.writeText(phone);
                showToast(`Đã sao chép ${phone}`);
            } catch (err) {
                showToast('Không thể sao chép số điện thoại');
            }
        }

        function formatPhone(phone) {
            const digits = String(phone || '').replace(/\D/g, '');
            return digits.length === 10 ? `${digits.slice(0, 4)}.${digits.slice(4, 7)}.${digits.slice(7)}` : phone;
        }

        const API_URL = 'https://tracuugiaoly.mantrandinhminh.workers.dev';
        const LAST_DASHBOARD_CODE_KEY = 'giaoly_last_dashboard_code';

        const savedDashboardCode = localStorage.getItem(LAST_DASHBOARD_CODE_KEY);
        if (savedDashboardCode) {
            document.getElementById('studentId').value = savedDashboardCode;
        }

        const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

        async function openDashboardWhenReady(group) {
            const result = document.getElementById('result');
            result.innerHTML = `
                <div class="state-box">
                    <div class="state-illustration"><span class="material-icons-round">cloud_sync</span></div>
                    <div class="state-text" id="serverLoadingText">Đang tải dữ liệu lớp, xin vui lòng đợi...</div>
                    <div class="server-progress-track"><div id="serverProgressBar" class="server-progress-bar"></div></div>
                    <div id="serverProgressNote" class="server-progress-note">Đang kết nối máy chủ Render...</div>
                </div>`;

            for (let attempt = 1; attempt <= 25; attempt++) {
                const percent = Math.min(92, 12 + attempt * 3);
                document.getElementById('serverProgressBar').style.width = `${percent}%`;
                document.getElementById('serverProgressNote').textContent =
                    attempt === 1 ? 'Đang lấy dữ liệu...' : `Máy chủ đang khởi động, lần kiểm tra ${attempt}/25...`;
                try {
                    const response = await fetch(`${API_URL}/`, { cache: 'no-store' });
                    if (response.ok) {
                        document.getElementById('serverProgressBar').style.width = '100%';
                        document.getElementById('serverLoadingText').textContent = 'Máy chủ đã sẵn sàng, đang mở trang lớp...';
                        await delay(250);
                        window.location.href = `glv-dashboard.html?group=${encodeURIComponent(group)}`;
                        return;
                    }
                } catch (err) {
                    // Render đang ở trạng thái ngủ/khởi động: tiếp tục thử lại.
                }
                await delay(3000);
            }

            document.getElementById('serverLoadingText').textContent = 'Máy chủ đang mất nhiều thời gian để khởi động.';
            document.getElementById('serverProgressNote').textContent = 'Vui lòng thử lại sau ít phút.';
        }

        document.getElementById('studentId').addEventListener('input', (e) => {
            e.target.value = e.target.value.toUpperCase();
        });

        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const studentId = document.getElementById('studentId').value.trim();
            if (!studentId) {
                showToast('Vui lòng nhập mã học viên');
                return;
            }
            const dashboardGroups = {
                GLVBH2026_MAN: 'man',
                GLVBH2026_THAO: 'thao',
                GLVBH2026_TRINH: 'trinh',
            };

            const dashboardCode = studentId.toUpperCase();
            if (dashboardGroups[dashboardCode]) {
                localStorage.setItem(LAST_DASHBOARD_CODE_KEY, dashboardCode);
                await openDashboardWhenReady(dashboardGroups[dashboardCode]);
                return;
            }

            const result = document.getElementById('result');

            result.innerHTML = `
                <div class="state-box">
                    <div class="loader-dots">
                        <span></span><span></span><span></span>
                    </div>
                    <div class="state-text" style="margin-top:14px;">Đang tải dữ liệu, xin Phụ Huynh đợi ạ...</div>
                </div>`;

            try {
                const res = await fetch(`${API_URL}/student/${studentId}`);
                const data = await res.json();

                if (!data.success) {
                    result.innerHTML = `
                        <div class="state-box">
                            <div class="state-illustration" style="background:var(--red-ghost);color:var(--red);">
                                <span class="material-icons-round">person_off</span>
                            </div>
                            <div class="state-text">Không tìm thấy học viên với mã "${studentId}"</div>
                        </div>`;
                    return;
                }

                renderStudent(data);

            } catch (err) {
                result.innerHTML = `
                    <div class="state-box">
                        <div class="state-illustration" style="background:var(--red-ghost);color:var(--red);">
                            <span class="material-icons-round">wifi_off</span>
                        </div>
                        <div class="state-text">Không thể kết nối đến máy chủ. Vui lòng thử lại.</div>
                    </div>`;
            }
        });

        function renderStudent(data) {
            const result = document.getElementById('result');
            const attendance = [...(data.attendance || [])].sort((a, b) => {
                const toTime = value => {
                    const [day, month, year] = String(value || '').split('/').map(Number);
                    return new Date(year || 0, (month || 1) - 1, day || 1).getTime();
                };
                return toTime(b.date) - toTime(a.date);
            });
            const total = attendance.length;
            const avatarUrl =  data.avatar || 'ava.png';
            const familyInfo = [
                data.dateOfBirth ? `<div class="family-info-item"><strong><span class="material-icons-round">cake</span>Ngày sinh</strong>${escapeHtml(data.dateOfBirth)}</div>` : '',
                data.fatherName ? `<div class="family-info-item"><strong><span class="material-icons-round">person</span>Cha</strong>${escapeHtml(data.fatherName)}</div>` : '',
                data.motherName ? `<div class="family-info-item"><strong><span class="material-icons-round">person</span>Mẹ</strong>${escapeHtml(data.motherName)}</div>` : '',
                data.phones?.length ? `<div class="family-info-item family-phones"><strong><span class="material-icons-round">phone</span>Số điện thoại · chạm để sao chép</strong>${data.phones.map(phone => `<button type="button" class="copy-phone" onclick="copyPhone('${escapeHtml(phone)}')">${escapeHtml(formatPhone(phone))}</button>`).join('')}</div>` : ''
            ].filter(Boolean).join('');

            const rows = attendance.map((item) => {

                return `
                <tr>
                    <td>
                        <span class="date-cell">${item.date}</span>
                    </td>

                    <td>
                        ${item.mass
                            ? '<span class="check-badge yes">✓</span>'
                            : '<span class="check-badge no">—</span>'}
                    </td>

                    <td>
                        ${item.catechism
                            ? '<span class="check-badge yes">✓</span>'
                            : '<span class="check-badge no">—</span>'}
                    </td>

                    <td>
                        ${item.adoration
                            ? '<span class="check-badge yes">✓</span>'
                            : '<span class="check-badge no">—</span>'}
                    </td>
                    <td>
                        ${item.confession
                            ? '<span class="check-badge yes">✓</span>'
                            : '<span class="check-badge no">—</span>'}
                    </td>

                </tr>
                `;
            }).join('');

            /* Dữ liệu điểm */
            const scores = data.scores || {};
            

            result.innerHTML = `

            <!-- PROFILE CARD -->
            <div class="profile-card">
                <div class="profile-banner">
                    <div class="profile-banner-pattern"></div>
                </div>
                <div class="profile-body">
                    <div class="profile-top">
                        <div class="profile-avatar">
                            <img src="${avatarUrl}"
                                class="profile-avatar"
                                onerror="this.src='ava.png'">
                        </div>
                        <div class="profile-info">
                            <div class="profile-name">${data.name}</div>
                            <div class="profile-role">
                                <span class="role-dot"></span>
                                ${data.className}
                                <span class="profile-status status-${getStatusKey(data.status)}">
                                    <span class="material-icons-round">info</span>
                                    ${data.status || 'Chưa cập nhật'}
                                </span>
                            </div>
                        </div>
                    </div>
                    <div class="profile-meta">
                        <div class="meta-item">
                            <span class="material-icons-round">badge</span>
                            Mã: ${data.studentId || data.id || '—'}
                        </div>
                        <div class="meta-item">
                            <span class="material-icons-round">calendar_today</span>
                            ${total} buổi điểm danh
                        </div>
                    </div>
                    ${data.leave ? `<div class="student-leave-box"><strong>Đơn phép</strong>${escapeHtml(data.leave)}</div>` : ''}
                    ${familyInfo ? `<div class="family-info">${familyInfo}</div>` : ''}
                </div>
            </div>

            <!-- STATS -->
            <div class="stats">
                <div class="stat-box blue">
                    <div class="stat-icon"><span class="material-icons-round">church</span></div>
                    <div class="stat-number" data-target="${data.totalMass}">0</div>
                    <div class="stat-label">Tổng Thánh Lễ</div>
                </div>
                <div class="stat-box green">
                    <div class="stat-icon"><span class="material-icons-round">menu_book</span></div>
                    <div class="stat-number" data-target="${data.catechism}">0</div>
                    <div class="stat-label">Tổng Giáo Lý</div>
                </div>
                <div class="stat-box red">
                    <div class="stat-icon">
                        <span class="material-icons-round">volunteer_activism</span>
                    </div>
                    <div class="stat-number" data-target="${data.adoration || 0}">0</div>
                    <div class="stat-label">Chầu Thánh Thể</div>
                </div>

                <div class="stat-box mix">
                    <div class="stat-icon">
                        <span class="material-icons-round">history</span>
                    </div>
                    <div class="stat-number" data-target="${data.confession || 0}">0</div>
                    <div class="stat-label">Lần Xưng Tội</div>
                </div>
            </div>

            <!-- BẢNG ĐIỂM DANH -->
            <section class="section">
                <div class="section-header">
                    <div class="section-title">
                        <span class="material-icons-round">fact_check</span>
                        Lịch Sử Điểm Danh
                    </div>
                    <div class="section-line"></div>
                    <div class="section-count">${total} bản ghi</div>
                </div>
                <div class="table-card">
                    <div class="table-container">
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th style="text-align:left;">Ngày</th>
                                        <th>Thánh Lễ</th>
                                        <th>Giáo Lý</th>
                                        <th>Chầu TT</th>
                                        <th>Xưng Tội</th>
                                    </tr
                                </thead>
                                <tbody>${rows}</tbody>
                            </table>
                        </div>
                        <div class="fade-bottom"></div>
                    </div>
                    <div class="load-more" id="loadMoreBtn" onclick="expandTable()">
                        <span>Xem thêm</span>
                        <span class="material-icons-round">expand_more</span>
                    </div>
                </div>
            </section>

          
            <!-- DIVIDER -->
            <div class="section-divider">
                <div class="divider-diamond"></div>
            </div>

            <!-- BẢNG KẾT QUẢ HỌC TẬP -->
            <section class="section">
                <div class="section-header">
                    <div class="section-title">
                        <span class="material-icons-round">school</span>
                        Kết Quả Học Tập Giáo Lý
                    </div>
                    <div class="section-line"></div>
                </div>
                <div class="table-card">
                    <table class="scores-table">
                        <thead>
                            <tr>
                                <th style="text-align:left;">Học Kỳ</th>
                                <th>Điểm</th>
                                <th>Kết Quả</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>
                                    <div class="semester-cell">
                                        <span class="semester-badge hk1">I</span>
                                        <span>Giữa Học Kỳ I</span>
                                    </div>
                                </td>
                                <td><span class="score-value">${scores.ghkiScore || '—'}</span></td>
                                <td>${getResultBadge(scores.ghkiResult)}</td>
                            </tr>
                            <tr>
                                <td>
                                    <div class="semester-cell">
                                        <span class="semester-badge hk1">I</span>
                                        <span>Cuối Học Kỳ I</span>
                                    </div>
                                </td>
                                <td><span class="score-value">${scores.chkiScore || '—'}</span></td>
                                <td>${getResultBadge(scores.chkiResult)}</td>
                            </tr>
                            <tr>
                                <td>
                                    <div class="semester-cell">
                                        <span class="semester-badge hk2">II</span>
                                        <span>Giữa Học Kỳ II</span>
                                    </div>
                                </td>
                                <td><span class="score-value">${scores.ghkiiScore || '—'}</span></td>
                                <td>${getResultBadge(scores.ghkiiResult)}</td>
                            </tr>
                            <tr>
                                <td>
                                    <div class="semester-cell">
                                        <span class="semester-badge hk2">II</span>
                                        <span>Cuối Học Kỳ II</span>
                                    </div>
                                </td>
                                <td><span class="score-value">${scores.chkiiScore || '—'}</span></td>
                                <td>${getResultBadge(scores.chkiiResult)}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
            

            `;

            /* Đếm số */
            setTimeout(() => {
                document.querySelectorAll('.stat-number[data-target]').forEach(el => {
                    animateNumber(el, parseInt(el.dataset.target, 10));
                });
            }, 200);
        }

        /* Xem thêm bảng điểm danh */
        function expandTable() {
            const wrapper = document.querySelector('.table-wrapper');
            const btn = document.getElementById('loadMoreBtn');
            const fade = document.querySelector('.fade-bottom');
            if (wrapper) {
                wrapper.style.maxHeight = 'none';
                if (fade) fade.style.display = 'none';
                if (btn) {
                    btn.innerHTML = '<span>Thu gọn</span><span class="material-icons-round">expand_less</span>';
                    btn.onclick = collapseTable;
                }
            }
        }

        function collapseTable() {
            const wrapper = document.querySelector('.table-wrapper');
            const btn = document.getElementById('loadMoreBtn');
            const fade = document.querySelector('.fade-bottom');
            if (wrapper) {
                wrapper.style.maxHeight = '520px';
                if (fade) fade.style.display = '';
                if (btn) {
                    btn.innerHTML = '<span>Xem thêm</span><span class="material-icons-round">expand_more</span>';
                    btn.onclick = expandTable;
                }
            }
        }

        document.getElementById('studentId').focus();

        
    </script>

</body>

</html>
